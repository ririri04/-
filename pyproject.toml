[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "note-auto-poster"
version = "0.1.0"
description = "note.comの画像をAIが選んでX/Instagramに自動投稿するツール"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "anthropic>=0.34",
    "requests-oauthlib>=1.3",
    "Pillow>=10.0",
]

[project.scripts]
note-auto-poster = "note_auto_poster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
